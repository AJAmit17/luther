# On a version tag (git tag v0.2.0 && git push origin v0.2.0): build luther for
# macOS and Linux, publish a GitHub release with the archives and checksums, and
# point the Homebrew formula at the tag.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write     # the release, and the formula commit on main
  id-token: write     # build provenance, which install.sh checks
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
      - name: Test
        run: cd server && go vet ./... && go test ./...
      - name: Build
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt --title "$GITHUB_REF_NAME" --generate-notes
      - name: Point the Homebrew formula at this tag
        run: |
          rev=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main && git checkout main
          sed -i -E "s|tag: \"[^\"]*\"|tag: \"$GITHUB_REF_NAME\"|; s|revision: \"[^\"]*\"|revision: \"$rev\"|" Formula/luther.rb
          git commit -am "Homebrew: luther $GITHUB_REF_NAME" && git push origin main || echo "formula already at $GITHUB_REF_NAME"
